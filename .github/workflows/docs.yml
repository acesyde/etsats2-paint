name: Documentation

# Builds the player documentation site (website/) on pull requests and
# deploys it to GitHub Pages from main. Node only: the screenshots and
# animations are rendered locally (mise run doc:media) and committed.
# The repository's Pages source must be set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - website/**
      # The site quotes the app's interface labels from these files.
      - crates/tp-i18n/locales/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - website/**
      - crates/tp-i18n/locales/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only Node and pnpm are installed below; don't let `mise run` add the rest.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: node pnpm

      - name: Build the site
        run: mise run doc:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
