schema: spec-driven

context: |
  TruckPaint is a livery editor for ETS2 and ATS, not a general vector editor.
  Product rules every change must respect:
  - Every project has a vehicle. There is no blank-texture project; vehicles
    without a package go through Custom vehicle (templates packed locally).
  - A project is a fleet of one game (ETS2 or ATS): several trucks with
    chosen variants and several trailers, exported as one mod.
  - Texture layouts (UVs) differ per vehicle. Sharing across vehicles is by
    elements (palette, symbols with per-texture instances, styles), never by
    copying a placement; only variants of the same truck may copy positions.
  - A paint job follows the game: a truck has cabins (a main texture each, or
    one shared main texture) and a trailer one main texture; both have
    accessory textures shared by the whole vehicle. Trailers have no
    variants. Packages record what the mod export needs (game path, cabin
    internal names, accessory ids, alt_uv, colour_picker).

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance: advisory, for how apply and archive work is conducted.
# The agents are defined in .claude/agents/.
operations:
  apply:
    guidance:
      - Once the code changes of a task group are done, delegate `mise run ci` to the rust-ui-tester agent and act on its failure report. Do not report the change as done before it passes, or say plainly which steps were skipped (GPU-only tests are ignored).
  archive:
    guidance:
      - Before archiving, delegate a check of the change to the docs-drift-checker agent and list the stale documentation pages (and the media sections to render again) in the archive summary. It only reports; do not edit the documentation as part of the archive.
