[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
tp-core = { path = "crates/tp-core" }
tp-ui = { path = "crates/tp-ui" }
tp-text = { path = "crates/tp-text" }
tp-file = { path = "crates/tp-file" }
tp-render = { path = "crates/tp-render" }

eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence", "wayland", "x11"] }
egui = "0.36.2"
kurbo = "0.13.1"
flo_curves = "0.8.1"
i_overlay = "9.0.0"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "fontconfig"] }
lyon_tessellation = "1.0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rfd = "0.17.2"
texpresso = { version = "2.0.2", features = ["rayon"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
blake3 = "1.8.7"
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
egui-phosphor = "0.14.0"
directories = "6.0.0"
ron = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
